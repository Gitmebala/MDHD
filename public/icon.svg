<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <!-- Home-screen icon: a single lilac blossom. Maskable, so the important
       content stays inside the safe circle (centre 80% of the canvas). -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#fdf7ff"/>
      <stop offset="100%" stop-color="#e9d6f7"/>
    </radialGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e3c4f2"/>
      <stop offset="100%" stop-color="#bd8fdd"/>
    </linearGradient>
  </defs>

  <rect width="192" height="192" rx="42" fill="url(#bg)"/>

  <g transform="translate(96 94)">
    <g fill="url(#petal)">
      <ellipse cx="0" cy="-30" rx="19" ry="29"/>
      <ellipse cx="0" cy="-30" rx="19" ry="29" transform="rotate(72)"/>
      <ellipse cx="0" cy="-30" rx="19" ry="29" transform="rotate(144)"/>
      <ellipse cx="0" cy="-30" rx="19" ry="29" transform="rotate(216)"/>
      <ellipse cx="0" cy="-30" rx="19" ry="29" transform="rotate(288)"/>
    </g>
    <circle r="15" fill="#ffd98e"/>
    <circle r="15" fill="none" stroke="#f7c96a" stroke-width="2"/>
    <circle cx="-4" cy="-4" r="3" fill="#fff0c8"/>
  </g>
</svg>
